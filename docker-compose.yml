services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kr4
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Драйвер psycopg 3 -> диалект postgresql+psycopg
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/kr4
    ports:
      - "8000:8000"

volumes:
  pgdata:
